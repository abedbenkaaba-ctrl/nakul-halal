<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NA'KUL HALAL — Administration</title>
<style>
  :root { --green:#0B3D2E; --gold:#C9A227; --cream:#F7F5EF; --ink:#1A1A1A; --mute:#6B7568; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--green); color: white; padding: 20px; }
  header h1 { margin:0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .85; }
  main { max-width: 480px; margin: 0 auto; padding: 20px; }
  .card { background: white; border: 1px solid #EDEAE0; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  label { font-size: 12px; color: var(--mute); display:block; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid #EDEAE0; border-radius: 10px; font-size: 14px; }
  button { width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 10px; background: var(--green); color: white; font-weight: 600; font-size: 14px; }
  button.secondary { background: var(--gold); color: var(--ink); }
  .status { font-size: 12px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; display:none; }
  .status.ok { background: #DCFCE7; color: #15803D; display:block; }
  .status.err { background: #FEE2E2; color: #B91C1C; display:block; }
  .locked { text-align: center; padding: 40px 20px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>NA'KUL HALAL — Administration</h1>
  <p>Gestion des restaurants, menus et livreurs</p>
</header>
<main>

  <div id="lockScreen" class="card locked">
    <h2>Connexion</h2>
    <label for="apiBase">Adresse de ton serveur</label>
    <input id="apiBase" placeholder="https://xxxxx.up.railway.app" value="https://appli-delivery-halal-production.up.railway.app" />
    <label for="adminKey">Ta clé ADMIN_KEY</label>
    <input id="adminKey" type="password" placeholder="Ta clé secrète" />
    <button onclick="unlock()">Se connecter</button>
    <div id="lockStatus" class="status"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>Ajouter un restaurant</h2>
      <label>Ville</label>
      <input id="r_city" list="cityOptions" placeholder="Lyon, Paris, Pont-de-Chéruy..." />
      <label>Nom du restaurant</label>
      <input id="r_name" placeholder="Le Beldi" />
      <label>Type de cuisine</label>
      <input id="r_cuisine" placeholder="Tacos, Burgers, Grillades" />
      <button onclick="addRestaurant()">Ajouter le restaurant</button>
      <div id="r_status" class="status"></div>
    </div>

    <div class="card">
      <h2>Ajouter un plat au menu</h2>
      <label>Identifiant du restaurant</label>
      <input id="m_restaurant_id" placeholder="Ex: r1 (donné après création)" />
      <label>Nom du plat</label>
      <input id="m_name" placeholder="Menu Tacos XL" />
      <label>Prix (€)</label>
      <input id="m_price" type="number" step="0.10" placeholder="12.90" />
      <button class="secondary" onclick="addMenuItem()">Ajouter le plat</button>
      <div id="m_status" class="status"></div>
    </div>

    <div class="card">
      <h2>Ajouter un livreur</h2>
      <label>Ville</label>
      <input id="d_city" list="cityOptions" placeholder="Lyon, Paris, Pont-de-Chéruy..." />
      <label>Nom du livreur</label>
      <input id="d_name" placeholder="Karim B." />
      <button onclick="addDriver()">Ajouter le livreur</button>
      <div id="d_status" class="status"></div>
    </div>

    <div class="card">
      <h2>🤲 Cagnotte solidaire</h2>
      <p style="font-size:13px;color:var(--mute);margin:0 0 12px;">Alimentée par les aumônes des clients à chaque commande.</p>
      <div style="display:flex;gap:10px;margin-bottom:14px;">
        <div style="flex:1;background:var(--cream);border-radius:12px;padding:12px;text-align:center;">
          <div style="font-size:20px;font-weight:700;" id="cagnotteCollected">—</div>
          <div style="font-size:11px;color:var(--mute);">Collecté au total</div>
        </div>
        <div style="flex:1;background:var(--cream);border-radius:12px;padding:12px;text-align:center;">
          <div style="font-size:20px;font-weight:700;color:var(--green);" id="cagnotteBalance">—</div>
          <div style="font-size:11px;color:var(--mute);">Disponible à redistribuer</div>
        </div>
      </div>
      <label>Montant à distribuer (€)</label>
      <input id="c_amount" type="number" step="0.10" placeholder="50.00" />
      <label>À qui / pourquoi (note)</label>
      <input id="c_note" placeholder="Ex : famille B. — Ramadan" />
      <button class="secondary" onclick="distributeCagnotte()">Enregistrer la distribution</button>
      <div id="c_status" class="status"></div>
      <div id="cagnotteHistory" style="margin-top:14px;"></div>
    </div>
  </div>
</main>
<datalist id="cityOptions"></datalist>

<script>
let API_BASE = "";
let ADMIN_KEY = "";

function unlock() {
  API_BASE = document.getElementById('apiBase').value.trim().replace(/\/$/, '');
  ADMIN_KEY = document.getElementById('adminKey').value.trim();
  if (!API_BASE || !ADMIN_KEY) {
    showStatus('lockStatus', 'err', 'Renseigne l\'adresse et ta clé.');
    return;
  }
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadCagnotte();
  loadCityOptions();
}

async function loadCityOptions() {
  try {
    const res = await fetch(API_BASE + '/api/cities');
    const cities = await res.json();
    const dl = document.getElementById('cityOptions');
    dl.innerHTML = cities.map((c) => `<option value="${c}">`).join('');
  } catch (e) {}
}

async function loadCagnotte() {
  try {
    const res = await fetch(API_BASE + '/api/cagnotte');
    const data = await res.json();
    document.getElementById('cagnotteCollected').textContent = Number(data.total_collected).toFixed(2) + ' €';
    document.getElementById('cagnotteBalance').textContent = Number(data.balance).toFixed(2) + ' €';
  } catch (e) {}
  try {
    const res2 = await fetch(API_BASE + '/api/cagnotte/ledger');
    const rows = await res2.json();
    const el = document.getElementById('cagnotteHistory');
    if (!rows.length) { el.innerHTML = '<div style="font-size:12px;color:var(--mute);">Aucun mouvement pour l\u2019instant.</div>'; return; }
    el.innerHTML = '<div style="font-size:12px;color:var(--mute);margin-bottom:6px;">Derniers mouvements</div>' + rows.map(r => `
      <div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #EDEAE0;">
        <span>${r.type === 'contribution' ? '➕ Aumône' : '➖ Distribution'}${r.note ? ' — ' + r.note : ''}</span>
        <span style="font-weight:600;">${r.type === 'contribution' ? '+' : '-'}${Number(r.amount).toFixed(2)} €</span>
      </div>`).join('');
  } catch (e) {}
}

async function distributeCagnotte() {
  const amount = parseFloat(document.getElementById('c_amount').value);
  const note = document.getElementById('c_note').value;
  if (!amount || amount <= 0) { showStatus('c_status', 'err', 'Indique un montant valide.'); return; }
  try {
    const res = await fetch(API_BASE + '/api/admin/cagnotte/distribute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
      body: JSON.stringify({ amount, note }),
    });
    if (!res.ok) throw new Error('Erreur ' + res.status);
    showStatus('c_status', 'ok', 'Distribution enregistrée !');
    document.getElementById('c_amount').value = '';
    document.getElementById('c_note').value = '';
    loadCagnotte();
  } catch (e) {
    showStatus('c_status', 'err', 'Échec : ' + e.message);
  }
}

function showStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'status ' + type;
  el.textContent = msg;
}

function slug(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Math.floor(Math.random()*10000);
}

async function addRestaurant() {
  const id = slug(document.getElementById('r_name').value || 'resto');
  const body = {
    id,
    city: document.getElementById('r_city').value,
    name: document.getElementById('r_name').value,
    cuisine: document.getElementById('r_cuisine').value,
  };
  try {
    const res = await fetch(API_BASE + '/api/admin/restaurants', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Erreur ' + res.status);
    showStatus('r_status', 'ok', 'Restaurant ajouté ! Son identifiant est : ' + id);
    document.getElementById('m_restaurant_id').value = id;
  } catch (e) {
    showStatus('r_status', 'err', 'Échec : ' + e.message);
  }
}

async function addMenuItem() {
  const body = {
    id: slug(document.getElementById('m_name').value || 'plat'),
    restaurant_id: document.getElementById('m_restaurant_id').value,
    name: document.getElementById('m_name').value,
    price: parseFloat(document.getElementById('m_price').value),
  };
  try {
    const res = await fetch(API_BASE + '/api/admin/menu-items', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Erreur ' + res.status);
    showStatus('m_status', 'ok', 'Plat ajouté au menu !');
  } catch (e) {
    showStatus('m_status', 'err', 'Échec : ' + e.message);
  }
}

async function addDriver() {
  const body = {
    id: slug(document.getElementById('d_name').value || 'livreur'),
    city: document.getElementById('d_city').value,
    name: document.getElementById('d_name').value,
  };
  try {
    const res = await fetch(API_BASE + '/api/admin/drivers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Erreur ' + res.status);
    showStatus('d_status', 'ok', 'Livreur ajouté !');
  } catch (e) {
    showStatus('d_status', 'err', 'Échec : ' + e.message);
  }
}
</script>
</body>
</html>
