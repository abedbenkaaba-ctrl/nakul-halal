<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest-restaurant.json" />
<meta name="theme-color" content="#0B3D2E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NA'KUL Resto" />
<link rel="apple-touch-icon" href="icon-192-restaurant.png" />
<title>NA'KUL HALAL — Restaurant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');
  :root { --green:#0B3D2E; --gold:#C9A227; --cream:#F7F5EF; --ink:#1A1A1A; --mute:#6B7568; --chip:#E8EFE8; }
  * { box-sizing:border-box; } body { margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); }
  .serif { font-family:'Fraunces',serif; }
  .wrap { max-width:480px; margin:0 auto; padding-bottom: 30px; }
  .header { background:var(--green); color:white; padding:16px; }
  select { background:transparent; border:none; color:white; font-family:'Fraunces',serif; font-size:17px; width:100%; }
  .stats { display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:10px; }
  .stat { background:rgba(255,255,255,.1); border-radius:12px; padding:10px; }
  .stat .num { font-size:18px; font-weight:600; } .stat .lbl { font-size:10px; opacity:.8; }
  .section-title { font-weight:500; font-size:14px; margin:16px 16px 8px; }
  .card { background:white; border:1px solid #EDEAE0; border-radius:16px; padding:14px; margin:0 16px 8px; }
  .pill { display:inline-block; font-size:10px; font-weight:600; padding:3px 8px; border-radius:999px; }
  .empty { font-style:italic; color:var(--mute); text-align:center; padding:32px; border:1px dashed #EDEAE0; border-radius:16px; margin:0 16px; }
  .btn { width:100%; padding:10px; border:none; border-radius:8px; color:white; font-weight:500; font-size:13px; margin-top:10px; background: var(--green); }
  .btn.gold { background:var(--gold); color:var(--ink); }
  .status-box { text-align:center; padding:8px; border-radius:8px; font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <select id="citySelect" onchange="loadRestaurants()"><option>Lyon</option><option>Paris</option><option>Marseille</option></select>
    <select id="restoSelect" onchange="selectRestaurant()" style="margin-top:4px;"></select>
    <div style="font-size:11px;opacity:.8;margin:4px 0 10px;">🟢 Vue tablette restaurant</div>
    <button id="notifBtn" onclick="enableNotifications()" style="width:100%;padding:9px;border:none;border-radius:10px;background:var(--gold);color:#1A1A1A;font-weight:600;font-size:12px;margin-bottom:10px;">🔔 Activer les notifications</button>
    <div style="font-size:12px;opacity:.8;">Aujourd'hui</div>
    <div class="stats">
      <div class="stat"><div class="num" id="statCount">0</div><div class="lbl">Commandes</div></div>
      <div class="stat"><div class="num" id="statCA">0 €</div><div class="lbl">Chiffre d'affaires</div></div>
      <div class="stat"><div class="num" style="color:var(--gold);">4.8 ★</div><div class="lbl">Note moyenne</div></div>
    </div>
  </div>
  <div class="section-title">Commandes en cours</div>
  <div id="ordersList"></div>
</div>
<script>
const API_BASE = "https://appli-delivery-halal-production.up.railway.app";
let restaurants = []; let selectedId = ""; let pollTimer = null;
const STATUS_LABELS = { nouvelle:"Nouvelle", acceptee:"Acceptée", preparation:"En préparation", prete:"Prête", en_livraison:"En livraison", livree:"Livrée" };
const STATUS_COLOR = { nouvelle:"#B8892B", acceptee:"#2563EB", preparation:"#C9A227", prete:"#0B3D2E", en_livraison:"#0B3D2E", livree:"#16A34A" };

async function loadRestaurants() {
  const city = document.getElementById('citySelect').value;
  const res = await fetch(`${API_BASE}/api/cities/${city}/restaurants`);
  restaurants = await res.json();
  const sel = document.getElementById('restoSelect');
  sel.innerHTML = restaurants.length ? restaurants.map(r => `<option value="${r.id}">${r.name}</option>`).join('') : '<option>Aucun restaurant</option>';
  selectedId = restaurants[0]?.id || '';
  selectRestaurant();
}

function selectRestaurant() {
  selectedId = document.getElementById('restoSelect').value;
  loadOrders();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadOrders, 3000);
}

// Doit être déclenché par un vrai clic (le téléphone bloque silencieusement
// une demande d'autorisation lancée automatiquement, sans geste de l'utilisateur).
async function enableNotifications() {
  const btn = document.getElementById('notifBtn');
  if (!selectedId) { alert('Choisis d\'abord un restaurant.'); return; }
  await initPush('restaurant', selectedId, document.getElementById('citySelect').value);
  if (Notification.permission === 'granted') {
    btn.textContent = '🔔 Notifications activées';
    btn.style.opacity = '0.6';
  } else {
    btn.textContent = '🔕 Autorisation refusée — réessayer';
  }
}

// ---------- Notifications push ----------
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const arr = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) arr[i] = rawData.charCodeAt(i);
  return arr;
}
async function initPush(role, refId, cityVal) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const { publicKey } = await (await fetch(`${API_BASE}/api/push/public-key`)).json();
    if (!publicKey) return;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
    await fetch(`${API_BASE}/api/push/subscribe`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role, ref_id: refId, city: cityVal, subscription: sub.toJSON ? sub.toJSON() : sub }),
    });
  } catch (e) {}
}

async function loadOrders() {
  if (!selectedId) { document.getElementById('ordersList').innerHTML = '<div class="empty">Aucun restaurant sélectionné.</div>'; return; }
  const res = await fetch(`${API_BASE}/api/restaurants/${selectedId}/orders`);
  const orders = await res.json();
  document.getElementById('statCount').textContent = orders.length;
  // Le chiffre d'affaires du restaurant ne compte que ses plats — pas les frais de livraison, le pourboire du livreur, ni l'aumône Cagnotte
  const ca = orders.reduce((s,o) => s + Number(o.items_total != null ? o.items_total : JSON.parse(o.items||'[]').reduce((a,i)=>a+i.price*i.qty,0)), 0);
  document.getElementById('statCA').textContent = ca.toFixed(0) + ' €';
  renderOrders(orders);
}

function renderOrders(orders) {
  const el = document.getElementById('ordersList');
  if (!orders.length) { el.innerHTML = "<div class=\"empty\">Aucune commande pour l'instant.</div>"; return; }
  el.innerHTML = orders.map(o => {
    const items = JSON.parse(o.items || '[]');
    let action = '';
    if (o.status === 'nouvelle') action = `<button class="btn" onclick="advance(${o.id},'acceptee')">Accepter la commande</button>`;
    else if (o.status === 'acceptee') action = `<button class="btn" onclick="advance(${o.id},'preparation')">Démarrer la préparation</button>`;
    else if (o.status === 'preparation') action = `<button class="btn gold" onclick="advance(${o.id},'prete')">Marquer comme prête</button>`;
    else if (o.status === 'prete') action = `<div class="status-box" style="background:#E8EFE8;color:var(--green);">🛵 En attente d'un livreur</div>`;
    else if (o.status === 'en_livraison') action = `<div class="status-box" style="background:#E8EFE8;color:var(--green);">🛵 Prise en charge par ${o.driver_name||''}</div>`;
    else if (o.status === 'livree') action = `<div class="status-box" style="background:#DCFCE7;color:#15803D;">✓ Livrée</div>`;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;"><b style="font-size:14px;">#${o.id}</b><b style="font-size:14px;">${Number(o.total).toFixed(2)} €</b></div>
      <div style="color:var(--mute);font-size:11px;margin:4px 0;">${o.address||''}</div>
      <span class="pill" style="background:${STATUS_COLOR[o.status]}1A;color:${STATUS_COLOR[o.status]};">${STATUS_LABELS[o.status]}</span>
      <div style="margin-top:8px;">${items.map(i=>`<div style="font-size:12px;color:var(--mute);">${i.qty}× ${i.name}</div>`).join('')}</div>
      ${Number(o.tip)>0 || Number(o.donation)>0 ? `<div style="font-size:10px;color:var(--mute);margin-top:4px;">${Number(o.tip)>0?`🛵 pourboire livreur ${Number(o.tip).toFixed(2)}€ `:''}${Number(o.donation)>0?`🤲 aumône ${Number(o.donation).toFixed(2)}€`:''}</div>` : ''}
      ${action}
    </div>`;
  }).join('');
}

async function advance(orderId, status) {
  await fetch(`${API_BASE}/api/orders/${orderId}/status`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status}) });
  loadOrders();
}

async function loadCityOptions() {
  try {
    const res = await fetch(`${API_BASE}/api/cities`);
    const cities = await res.json();
    const sel = document.getElementById('citySelect');
    const existing = Array.from(sel.options).map((o) => o.value);
    cities.forEach((c) => { if (!existing.includes(c)) sel.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`); });
  } catch (e) {}
}

loadRestaurants();
loadCityOptions();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
